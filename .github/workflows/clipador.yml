name: Clipador

# Edite lives.txt (um link por linha) e faça commit: a gravação começa sozinha.
on:
  push:
    paths: [lives.txt, palavras.txt, "clipador/**", .github/workflows/clipador.yml]
  workflow_dispatch:
    inputs:
      duracao:
        description: "Minutos de gravação (máx. 340)"
        default: "330"

concurrency:
  group: clipador-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write  # para se reiniciar sozinho

jobs:
  clipar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig fonts-dejavu-core libass9
      - run: pip install -q -r requirements.txt
      - name: Gravar e cortar (clipes vão saindo em Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set +e  # um upload que falha não pode derrubar o resto
          TAG="clipes-$GITHUB_RUN_ID"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Clipes $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" \
            --notes "Clipes verticais prontos para postar. Novos aparecem aqui a cada ~1 min."
          mkdir -p enviados
          enviar() {
            find clipes -name '*_vertical.mp4' -mmin +0.2 2>/dev/null | while read -r f; do
              n="$(basename "$(dirname "$f")")_$(basename "$f")"
              [ -e "enviados/$n" ] || [ -e "descartados/$n" ] && continue
              cp "$f" "enviados/$n" && gh release upload "$TAG" "enviados/$n" --clobber \
                && echo "📤 publicado: $n"
              t="${f%.mp4}.txt"
              [ -f "$t" ] && cp "$t" "enviados/${n%.mp4}.txt" \
                && gh release upload "$TAG" "enviados/${n%.mp4}.txt" --clobber >/dev/null 2>&1
              if [ -n "$TIKTOK_CLIENT_KEY" ] && [ -f tiktok_token.enc ]; then
                python -m clipador.tiktok enviar "enviados/$n" 2>&1 | tail -2
                if ! git diff --quiet tiktok_token.enc; then  # token renovado
                  git -c user.name=clipador -c user.email=clipador@users.noreply.github.com \
                    commit -qm "token TikTok renovado [skip ci]" tiktok_token.enc && git push -q
                fi
              fi
            done
            python -m clipador.indice enviados "$GITHUB_REPOSITORY" "$TAG" > notas.new 2>/dev/null \
              && ! cmp -s notas.new notas.md && mv notas.new notas.md \
              && gh release edit "$TAG" --notes-file notas.md >/dev/null 2>&1
            [ -f clipador.log ] && cp clipador.log enviados/log.txt \
              && gh release upload "$TAG" enviados/log.txt --clobber >/dev/null 2>&1
          }
          ( set +e; while true; do sleep 45; enviar || true; done ) &
          # de hora em hora: nota cada clipe novo, apaga os fracos e separa os
          # melhores (~40%) no release fixo "melhores"
          mkdir -p descartados; touch avaliados.lst
          gh release view melhores >/dev/null 2>&1 || gh release create melhores --latest=false \
            --title "⭐ Melhores (seleção automática de hora em hora)" \
            --notes "Só os clipes que passaram na seleção: fala, reação do streamer, pico do chat e tipo do momento. Os fracos são apagados sozinhos."
          limpar() {
            ls enviados/*_vertical.mp4 2>/dev/null | xargs -rn1 basename | sed 's/\.mp4$//' \
              | grep -vxF -f avaliados.lst > novos.lst
            [ -s novos.lst ] || return 0
            python -m clipador.ranking selecionar enviados novos.lst 0.4 | while read -r acao n nota; do
              echo "🧹 $acao $n (nota $nota)"
              if [ "$acao" = DESCARTAR ]; then
                gh release delete-asset "$TAG" "$n.mp4" -y >/dev/null 2>&1
                gh release delete-asset "$TAG" "$n.txt" -y >/dev/null 2>&1
                mv enviados/"$n".* descartados/ 2>/dev/null
              else
                gh release upload melhores "enviados/$n.mp4" "enviados/$n.txt" --clobber >/dev/null 2>&1
              fi
            done
            cat novos.lst >> avaliados.lst
          }
          ( set +e; while true; do sleep 3600; limpar || true; done ) &
          # top 5 de GTA 6 mais vistos da Twitch (PT-BR): prontos até 10h, 17h e 21h
          virais() {
            gh release view melhores --json assets -q '.assets[].name' > feitos.lst 2>/dev/null
            python -m clipador.virais virais feitos.lst 2>>clipador.log | while read -r f; do
              gh release upload melhores "$f" "${f%.mp4}.txt" --clobber >/dev/null 2>&1 \
                && echo "🏆 top5: $(basename "$f")"
            done
          }
          ( set +e; while true; do virais || true; sleep 300; done ) &
          # pedidos de corte manual: asset "cortar.txt" no release (ex: "calango")
          touch comandos
          ( set +e; ultimo=""; while true; do
              sleep 8
              # pedido = conteúdo de pedido.txt no branch ("<canal> <id único>")
              p=$(gh api "repos/$GITHUB_REPOSITORY/contents/pedido.txt?ref=$GITHUB_REF_NAME" \
                --jq .content 2>/dev/null | base64 -d 2>/dev/null | head -1 | xargs)
              [ -z "$ultimo" ] && [ -n "$p" ] && ultimo="$p"  # ignora pedido antigo
              [ -z "$p" ] || [ "$p" = "$ultimo" ] && continue
              ultimo="$p"
              echo "✋ pedido: $p"
              echo "${p%% *}" >> comandos
            done ) &
          python -m clipador $(grep -v '^\s*#' lives.txt | xargs) \
            --duracao "${{ inputs.duracao || '330' }}" -o clipes \
            --aquecimento 30 --minimo 10 \
            --palavras "$(tr '\n' ',' < palavras.txt)" --intervalo 20 --curadoria 6 \
            < <(tail -n0 -F comandos) 2>&1 | tee clipador.log || true
          sleep 5; enviar; limpar
      - name: Clipes verticais (prontos para postar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipes-verticais
          path: clipes/**/*_vertical.mp4
          if-no-files-found: warn
      - name: Clipes originais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipes-originais
          path: |
            clipes/**/*.mp4
            !clipes/**/*_vertical.mp4
          if-no-files-found: warn
      - name: Reiniciar a gravação (nova rodada)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clipador.yml --ref "$GITHUB_REF_NAME"
